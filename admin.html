<!DOCTYPE HTML>
<html lang="en-US">
    <head>
        <title>OKAWE Media Admin</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
        <link rel="shortcut icon" href="images/favicon.png" />
        <link href='http://fonts.googleapis.com/css?family=Roboto:300,400,400i,700,700i,900|Montserrat:400,700|PT+Serif' rel='stylesheet' type='text/css'>
        <link rel="stylesheet" type="text/css"  href='css/clear.css' />
        <link rel="stylesheet" type="text/css"  href='css/common.css' />
        <link rel="stylesheet" type="text/css"  href='css/font-awesome.min.css' />
        <link rel="stylesheet" type="text/css"  href='style.css' />
        <style>
            body { background: #1a1a1a; color: #fff; }
            .admin-wrapper { max-width: 900px; margin: 40px auto; padding: 30px; background: #2a2a2a; border-radius: 8px; }
            .admin-wrapper h1 { margin-top: 0; }
            input[type="password"] { padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
            button { padding: 8px 20px; background: #32db89; color: white; border: none; border-radius: 4px; cursor: pointer; }
            button:hover { opacity: 0.9; }
            .error { color: #e64b77; margin-top: 10px; }
            #admin-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 10000; overflow-y: auto; padding: 20px; }
            #admin-modal .admin-content-inner { background: white; max-width: 900px; margin: 20px auto; padding: 30px; border-radius: 8px; position: relative; }
            #admin-close { position: absolute; top: 10px; right: 15px; cursor: pointer; background: none; border: none; font-size: 24px; color: #333; }
        </style>
    </head>
    <body>
        <div class="admin-wrapper">
            <h1>OKAWE Media Admin</h1>
            <p>Enter your admin code to access the content editor.</p>
            <input type="password" id="admin-password" placeholder="Admin code">
            <button id="submit-password">Access Admin</button>
            <p id="password-error" class="error" style="display: none;">Incorrect code!</p>
            <div id="admin-content"></div>
        </div>

        <!-- Admin Modal (hidden, shown after password) -->
        <div id="admin-modal">
            <div class="admin-content-inner">
                <button id="admin-close">&times;</button>
                <div id="admin-content-inner"></div>
            </div>
        </div>

        <script type="text/javascript" src="js/jquery.js"></script>
        <script type="text/javascript" src="js/data-loader.js"></script>
    </body>
</html>
